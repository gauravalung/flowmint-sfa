services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowmint
    ports:
      - "5432:5432"
    volumes:
      - flowmint_pg_data:/var/lib/postgresql/data

volumes:
  flowmint_pg_data:
