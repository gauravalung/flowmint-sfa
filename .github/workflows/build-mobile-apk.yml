name: Build mobile debug APK

# Manual only — this exists so a working .apk can be produced somewhere with
# real internet access to the Android SDK (Google's SDK servers and Expo's
# build service are both unreachable from the sandbox this project is
# normally developed in; see claude/DECISIONS.md). Debug build: unsigned
# with Android's auto-generated debug keystore, good enough to install and
# check on a device, not for Play Store distribution.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: npm install

      - name: Build shared package
        run: npm run build:shared

      - name: Expo prebuild (generates the native android/ project)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowmint-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
